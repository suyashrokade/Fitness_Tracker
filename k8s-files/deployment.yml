apiVersion: apps/v1
kind: Deployment

metadata:
  name: suyash-deployment
  namespace: suyash-ns
  labels:
    first: app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: web

  template:
    metadata:
      labels:
        app: web

    spec:
      containers:
      - name: suyash-container
        image: suyashrokade78/fitness:v1.0.0

        ports:
        - containerPort: 5000

        volumeMounts:
        - name: app-storage
          mountPath: /app/data

      volumes:
      - name: app-storage
        emptyDir: {}